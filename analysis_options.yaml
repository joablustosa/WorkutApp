    - lib/screens/entrar_torcida_screen.dart
    - lib/screens/event_story_screen.dart
    - lib/screens/minha_torcida_screen.dart
    - lib/screens/notifications_screen.dart
    - lib/screens/perfil_screen.dart
    - lib/screens/splash_screen.dart
    - lib/services/album_service.dart
    - lib/services/auth_service_supabase.dart
    - lib/services/event_service.dart
    - lib/services/gamification_service.dart
    - lib/services/membership_service.dart
    - lib/services/notification_service.dart
    - lib/services/permissions_service.dart
    - lib/services/post_service.dart
    - lib/services/store_service.dart
