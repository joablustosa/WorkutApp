name: workut
description: Workut - a rede social de quem treina. Poste seu treino, siga amigos, dê depoimentos e bata seus PRs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  intl: any
  http: ^1.6.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icon_launcher.png
    - assets/logo.png
    - assets/favicon.png
    - assets/hero_login.png
